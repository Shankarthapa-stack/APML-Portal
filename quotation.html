<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APML Official PDF Quotation Editor</title>

  <!-- HTML2PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #17388e;
      padding: 20px 10px;
      min-height: 100vh;
    }

    /* Top Control Bar */
    .top-action-bar {
      max-width: 800px;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-back {
      background: #ff9900;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    .template-select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1.5px solid #17388e;
      font-weight: bold;
      font-size: 13px;
      background: #ffffff;
      color: #17388e;
      cursor: pointer;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-pdf { background: #28a745; color: white; }
    .btn-print { background: #00bcd4; color: white; }
    .btn-add { background: #ff9900; color: white; margin: 10px 0; }

    /* EXACT PDF PRINTABLE SHEET (Identical to uploaded PDFs) */
    .pdf-page {
      background: #ffffff;
      width: 800px;
      margin: 0 auto;
      padding: 40px 45px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      color: #000000;
      font-size: 11.5px;
      line-height: 1.4;
    }

    /* Universal Editable Inputs */
    input {
      border: 1px dashed #aaaaaa;
      padding: 2px 4px;
      font-size: 11.5px;
      font-family: inherit;
      color: #000000;
      background-color: #f8fafc;
      border-radius: 2px;
    }

    input:focus {
      outline: none;
      border: 1px solid #17388e;
      background: #ffffff;
    }

    /* Exact Company Titles */
    .comp-name {
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      color: #000000;
      margin-bottom: 2px;
    }

    .comp-details {
      font-size: 10.5px;
      color: #000000;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    /* Quotation Header */
    .quote-title {
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      margin: 12px 0;
      letter-spacing: 0.5px;
    }

    /* Exact Meta Layout */
    .meta-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 20px;
      margin-bottom: 12px;
      font-size: 11px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-item label {
      font-weight: bold;
      white-space: nowrap;
    }

    /* Exact Table Formatting */
    table.pdf-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
    }

    table.pdf-table th, table.pdf-table td {
      border: 1px solid #000000;
      padding: 5px 8px;
      font-size: 11px;
    }

    table.pdf-table th {
      background-color: #ffffff;
      font-weight: bold;
      text-align: left;
    }

    .num-input {
      width: 100px;
      text-align: right;
    }

    .btn-del {
      color: red;
      background: none;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* Terms & Conditions */
    .terms-sec {
      margin-top: 15px;
      font-size: 10px;
    }

    .terms-sec h4 {
      font-size: 10.5px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .terms-sec ol {
      padding-left: 16px;
      line-height: 1.4;
    }

    .closing-sec {
      margin-top: 15px;
      font-size: 11px;
      line-height: 1.4;
    }

    .footer-address {
      margin-top: 20px;
      border-top: 1px solid #000000;
      padding-top: 8px;
      font-size: 10px;
    }

    /* CLEAN EXPORT STYLES */
    .no-export { display: table-cell; }
    
    @media print {
      body { background: white; padding: 0; }
      .top-action-bar, .no-export, .btn-add { display: none !important; }
      .pdf-page { box-shadow: none; width: 100%; padding: 0; }
      input {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        width: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Action Controls -->
  <div class="top-action-bar">
    <a href="index.html" class="btn-back">🌐 APML Portal</a>
    
    <div>
      <select id="templateSelector" class="template-select" onchange="switchTemplate()">
        <option value="exact">EXACT CONTAINER LOGISTIC PVT. LTD.</option>
        <option value="maxcare">MAXCARE PACKERS & MOVERS PVT. LTD.</option>
      </select>
    </div>

    <div class="action-buttons">
      <button type="button" class="btn-action btn-pdf" onclick="downloadPDF()">📥 Download PDF</button>
      <button type="button" class="btn-action btn-print" onclick="window.print()">🖨️ Print</button>
    </div>
  </div>

  <!-- PDF CONTENT SHEET -->
  <div class="pdf-page" id="pdfContent">
    
    <!-- Header -->
    <div class="comp-name" id="comp-title">EXACT CONTAINER LOGISTIC PVT. LTD.</div>
    <div class="comp-details" id="comp-details">
      CIN: U74899DL2000PTC107846<br>
      GST No: 23AAACL1838J1ZO
    </div>

    <!-- Meta Info -->
    <div class="meta-box" id="meta-box">
      <!-- Populated via JS -->
    </div>

    <div class="quote-title">QUOTATION</div>

    <p style="margin-bottom: 10px;" id="opening-text">
      <!-- Opening text loaded dynamically -->
    </p>

    <!-- Table -->
    <table class="pdf-table" id="pdf-table">
      <thead>
        <tr id="table-head">
          <!-- Headings loaded dynamically -->
        </tr>
      </thead>
      <tbody id="itemsBody">
        <!-- Rows loaded dynamically -->
      </tbody>
    </table>

    <!-- Amount Add Button -->
    <button type="button" class="btn-action btn-add no-export" onclick="addNewRow()">➕ Add Amount Item</button>

    <!-- Terms -->
    <div class="terms-sec">
      <h4>TERMS & CONDITION:</h4>
      <ol id="termsList">
        <!-- Terms loaded dynamically -->
      </ol>
    </div>

    <!-- Footer / Closing -->
    <div id="footer-section"></div>

  </div>

  <script>
    const templates = {
      exact: {
        title: "EXACT CONTAINER LOGISTIC PVT. LTD.",
        details: "CIN: U74899DL2000PTC107846<br>GST No: 23AAACL1838J1ZO",
        meta: [
          { label: "Date:", val: "22nd Aug 2026" },
          { label: "Estimate No.:", val: "2025323429" },
          { label: "MR./MS.:", val: "Ranu" },
          { label: "Company Name:", val: "Unregistered" },
          { label: "GST No:", val: "GST Exempted" }
        ],
        opening: 'Dear Sir / Mam,<br>Below are our best prices for moving your <input type="text" value="mumbai to pune" style="font-weight:bold; width:150px;">. We hope you will find our price competitive enough & will give us an opportunity to service you.',
        columns: ["Cost Item", "Cost (in INR)"],
        items: [
          { name: "Freight", amount: 4800 },
          { name: "Car Freight", amount: 0 },
          { name: "Packing Charges", amount: 1600 },
          { name: "Loading Charges at Origin", amount: 800 },
          { name: "Unloading Charges at Destination", amount: 400 },
          { name: "Unpacking Charges", amount: 240 },
          { name: "Other Charges (Toll etc.)", amount: 160 }
        ],
        gstRate: 0,
        terms: [
          "Please keep your cash/jewelry in your custody.",
          "Carrying liquor, gas cylinder, acid or any type of liquid/explosive and illegal items is prohibited.",
          "Minimum 15 litres of fuel should be available in the car to run up to the car carrier point and the same way from the car carrier point to the destination.",
          "We don't undertake electrical, carpentry & plumbing work. It can be provided depending on availability and charged accordingly.",
          "If there is any extra packing of any article, or an article outside the article list, it will be charged accordingly.",
          "Extra services provided other than mentioned will be charged accordingly.",
          "20% of the amount to be paid in advance along with the work order and the balance amount on completion of work at the loading point.",
          "Payment in cash/cheque/draft should be in favor of Exact Container Logistics (P) Ltd.",
          "In case of carrier risk, no individual policy / receipt from the insurance company will be given.",
          "In case of monsoon / rainy season / foggy weather / riots / vehicle breakdown / any other natural calamity, 7 extra days will be added to the transit time.",
          "No responsibility on the breakage of flower pots.",
          "This quotation is valid for 15 days."
        ],
        footer: `<div class="footer-address">Registered address: 7737/XV RAM NAGAR QUTUB ROAD, PAHARGANJ NEW DELHI 110063<br>Phone: 9667724226</div>`
      },
      maxcare: {
        title: "MAXCARE PACKERS & MOVERS PVT. LTD.",
        details: "CIN: U63090DL2009PTC196378<br>Regd. Office: 308, Neelkanth Plaza, Pitampura Community Centre, New Delhi-110034.<br>Phone: 9311204263 Email: maxcaremoverspvtltd@gmail.com<br>GSTN (ours): 07AAICM9877E1ZX",
        meta: [
          { label: "Reference No.:", val: "MAX202526954" },
          { label: "Date:", val: "22nd Aug 2026" },
          { label: "TO:", val: "Ranu" },
          { label: "Company Name:", val: "Unregistered" },
          { label: "GST No:", val: "GST Exempted" }
        ],
        opening: 'We thank you for your inquiry to move your household goods from <input type="text" value="mumbai to pune" style="font-weight:bold; width:150px;">. We have pleasure in quoting our charges as follows:',
        columns: ["S.No", "Particulars", "Amount"],
        items: [
          { name: "Transportation Cost", amount: 0 },
          { name: "Packing + Loading + Unloading + Unpacking", amount: 0 },
          { name: "Car Transportation (if any)", amount: 0 },
          { name: "Toll Tax + Risk Cover + Misc. Cost", amount: 0 }
        ],
        gstRate: 0,
        terms: [
          "Please note that lorry transportation charges without quotes are the present prevailing rates and will be charged on actuals at the time of transportation. Extra charges will be charged extra as actual.",
          "The carrier or agent shall be exempted from any loss or damage through accident, pilferage, fire, rain, collision or any other road-driven hazard; we therefore recommend that goods be insured covering risk. While on carrier risk, no individual policy/receipt from the insurance co. will be given.",
          "We would request you to please pay 25% of all charges in advance along with your order, and the balance charges on completion of the packing. For insurance, the full amount of the premium value is to be paid at the packing location before departure of the consignment.",
          "Please note that the above quotation has been prepared keeping in view our basic standards of packing with the best packing material, as the type of packing will depend on our discretion.",
          "We would be grateful if you could please give us one week's advance notice as to when we may commence the above job. Payment will be done in favor of M/S Max Care Packers & Movers Pvt. Ltd."
        ],
        footer: `<div class="closing-sec">Thanking you and looking forward to rendering our service to you.<br><br>With Regards,<br><b>M/s MAXCARE PACKERS & MOVERS Pvt. Ltd.</b></div>`
      }
    };

    function switchTemplate() {
      const key = document.getElementById('templateSelector').value;
      const tpl = templates[key];

      document.getElementById('comp-title').innerText = tpl.title;
      document.getElementById('comp-details').innerHTML = tpl.details;
      document.getElementById('opening-text').innerHTML = tpl.opening;
      document.getElementById('footer-section').innerHTML = tpl.footer;

      // Meta Box
      const metaBox = document.getElementById('meta-box');
      metaBox.innerHTML = '';
      tpl.meta.forEach(item => {
        metaBox.innerHTML += `
          <div class="meta-item">
            <label>${item.label}</label>
            <input type="text" value="${item.val}">
          </div>
        `;
      });

      // Table Headers
      const thead = document.getElementById('table-head');
      thead.innerHTML = '';
      tpl.columns.forEach(col => {
        thead.innerHTML += `<th>${col}</th>`;
      });
      thead.innerHTML += `<th class="no-export" style="width: 40px; text-align: center;">Action</th>`;

      // Items
      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      tpl.items.forEach((item, idx) => {
        appendRow(key, idx + 1, item.name, item.amount);
      });

      // Terms
      const termsList = document.getElementById('termsList');
      termsList.innerHTML = '';
      tpl.terms.forEach(term => {
        termsList.innerHTML += `<li><input type="text" value="${term}" style="width:100%;"></li>`;
      });

      calculateTotals();
    }

    function appendRow(type, sno, name, amount) {
      const tbody = document.getElementById('itemsBody');
      const tr = document.createElement('tr');

      if (type === 'maxcare') {
        tr.innerHTML = `
          <td class="sno-cell" style="width: 40px; text-align: center;">${sno}</td>
          <td><input type="text" value="${name}" style="width:100%;"></td>
          <td style="width: 120px; text-align: right;">
            ₹ <input type="number" class="num-input" value="${amount}" oninput="calculateTotals()">
          </td>
          <td class="no-export" style="text-align: center;">
            <button type="button" class="btn-del" onclick="deleteRow(this)">✖</button>
          </td>
        `;
      } else {
        tr.innerHTML = `
          <td><input type="text" value="${name}" style="width:100%;"></td>
          <td style="width: 140px; text-align: right;">
            ₹ <input type="number" class="num-input" value="${amount}" oninput="calculateTotals()">
          </td>
          <td class="no-export" style="text-align: center;">
            <button type="button" class="btn-del" onclick="deleteRow(this)">✖</button>
          </td>
        `;
      }
      tbody.appendChild(tr);
    }

    function addNewRow() {
      const key = document.getElementById('templateSelector').value;
      const tbody = document.getElementById('itemsBody');
      const totalRows = tbody.querySelectorAll('tr:not(.calc-row)').length;
      appendRow(key, totalRows + 1, "New Additional Charge", 0);
      calculateTotals();
    }

    function deleteRow(btn) {
      btn.closest('tr').remove();
      reindexSno();
      calculateTotals();
    }

    function reindexSno() {
      const cells = document.querySelectorAll('.sno-cell');
      cells.forEach((cell, idx) => {
        cell.innerText = idx + 1;
      });
    }

    function calculateTotals() {
      // Remove old subtotal / total rows
      document.querySelectorAll('.calc-row').forEach(row => row.remove());

      const key = document.getElementById('templateSelector').value;
      const inputs = document.querySelectorAll('.num-input');
      let subtotal = 0;
      inputs.forEach(inp => subtotal += parseFloat(inp.value) || 0);

      const tbody = document.getElementById('itemsBody');

      if (key === 'exact') {
        tbody.innerHTML += `
          <tr class="calc-row" style="font-weight: bold;">
            <td>Total</td>
            <td style="text-align: right;">₹ ${subtotal.toFixed(2)}</td>
            <td class="no-export"></td>
          </tr>
          <tr class="calc-row">
            <td>GST Charges @ 0%</td>
            <td style="text-align: right;">₹ 0.00</td>
            <td class="no-export"></td>
          </tr>
          <tr class="calc-row" style="font-weight: bold;">
            <td>Total with GST</td>
            <td style="text-align: right;">₹ ${subtotal.toFixed(2)}</td>
            <td class="no-export"></td>
          </tr>
        `;
      } else {
        const rowNum = tbody.querySelectorAll('tr:not(.calc-row)').length;
        tbody.innerHTML += `
          <tr class="calc-row" style="font-weight: bold;">
            <td style="text-align: center;">${rowNum + 1}</td>
            <td>Total</td>
            <td style="text-align: right;">₹ ${subtotal.toFixed(2)}</td>
            <td class="no-export"></td>
          </tr>
          <tr class="calc-row">
            <td style="text-align: center;">${rowNum + 2}</td>
            <td>GST Charges @ 0%</td>
            <td style="text-align: right;">₹ 0.00</td>
            <td class="no-export"></td>
          </tr>
          <tr class="calc-row" style="font-weight: bold;">
            <td colspan="2">Total Charges with GST</td>
            <td style="text-align: right;">₹ ${subtotal.toFixed(2)}</td>
            <td class="no-export"></td>
          </tr>
        `;
      }
    }

    function downloadPDF() {
      const inputs = document.querySelectorAll('#pdfContent input');
      inputs.forEach(input => input.style.border = 'none');

      const noExports = document.querySelectorAll('.no-export');
      noExports.forEach(el => el.style.display = 'none');

      const element = document.getElementById('pdfContent');
      const opt = {
        margin:       [5, 5, 5, 5],
        filename:     'APML_Quotation.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        inputs.forEach(input => input.style.border = '1px dashed #aaaaaa');
        noExports.forEach(el => el.style.display = '');
      });
    }

    window.onload = switchTemplate;
  </script>
</body>
</html>
